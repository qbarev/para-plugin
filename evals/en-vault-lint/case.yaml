schema_version: "1"
name: en-vault-lint
description: /para:vault-lint on the legacy-en fixture (LANG = en); the only expected finding is the legacy Tasks/ folder, reported with English finding names.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/para:vault-lint"
  max_turns: 40
  allowed_tools: [Read, Glob, Grep, Bash]
runs: 1
graders:
  - type: regex
    name: reports-legacy-tasks
    pattern: 'Studio website[\s\S]*Tasks/'
  - type: regex
    name: no-breakage-section
    pattern: '###\s*Breaks the vault'
    match: not_contains
  - type: regex
    name: no-schema-section
    pattern: '###\s*Violates the schema'
    match: not_contains
  - type: regex
    name: no-russian-in-output
    pattern: '[А-Яа-я]'
    match: not_contains
