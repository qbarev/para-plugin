schema_version: "1"
name: vault-lint
description: /para:vault-lint on the legacy fixture; the only expected finding is the legacy Tasks/ folder.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/para:vault-lint"
  max_turns: 40
  allowed_tools: [Read, Glob, Grep, Bash]
runs: 1
graders:
  - type: regex
    name: reports-legacy-tasks
    pattern: 'Сайт студии[\s\S]*Tasks/'
  - type: regex
    name: no-breakage-section
    pattern: '###\s*Ломает хранилище'
    match: not_contains
  - type: regex
    name: no-schema-section
    pattern: '###\s*Нарушает схему'
    match: not_contains
