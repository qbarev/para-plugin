schema_version: "1"
name: init-b-questions
tags: [init-b]
description: /para:init on the arbitrary vault with only the setup answers given. The obvious is decided without asking; what is disputed is asked in groups — per folder, not per note (single notes only at the vault root), largest group first, each with «leave as is» — and nothing is moved before the answers.
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/para:init Answers in advance: language en; PARA_DIR: the default; tasks: files; Areas are not grouped (GROUPING none)."
  max_turns: 80
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit]
runs: 1
graders:
  - type: regex
    name: asks-about-work-folder
    pattern: 'Работа'
  - type: regex
    name: asks-about-health-folder
    pattern: 'Здоровье'
  - type: regex
    name: asks-about-moving-folder
    pattern: 'Переезд в новую квартиру'
  - type: regex
    name: offers-leave-as-is
    pattern: 'leave (it |them )?as (it )?is'
    flags: i
  - type: tool_used
    name: nothing-moved
    tool: Bash
    input_match: '(^|[;&|\s(])mv\s'
    min: 0
    max: 0
  - type: llm
    name: grouped-questions
    criteria: "The reply asks about the disputed parts of the vault in groups: one item per folder (for example «Работа», «Здоровье», «Переезд в новую квартиру»), never one question per note inside a folder (naming a few example notes to describe a folder is fine); single notes are asked about individually only when they sit at the vault root. Each item offers project, area, resource, archive or leave as is. The folder items are ordered from the largest to the smallest. The reference folder «Справочник», «Daily», «attachments» and «Шаблоны» are not among the numbered questions (listing them as decided without asking is fine)."
